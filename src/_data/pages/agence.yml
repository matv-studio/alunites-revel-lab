title: '*Ce que* nous sommes, *en somme…*'
intro: |-
  <p>Chez Alunites, nous avons l’intime conviction que, dans un monde en perpétuelle évolution, il faut savoir se démarquer pour faire entendre sa voix.<br />
  Nous croyons à la singularité de chaque personne, de chaque marque.<br />
  Et c’est notre job de mettre en mots, en images, en événements – en lumière finalement ! – ce qui vous rend unique.</p>
  <p>C’est pour ça que notre créativité et la pluralité de nos expertises sont à votre service.<br />
  C’est pour ça aussi que nous construisons vos communications avec vous.<br />
  Parce qu’ensemble, on est plus forts, plus pertinents, plus fous peut-être ?<br />
  Alors ensemble, cassons les codes et enchantons le monde, en tout cas, essayons !</p>
  <p>Être pluriels, c’est ce qui nous rend singuliers.<br />
  Nous avons d’ailleurs choisi d’en faire notre marque de fabrique pour concevoir et produire des communications uniques au service de votre marque et de votre singularité.</p>
