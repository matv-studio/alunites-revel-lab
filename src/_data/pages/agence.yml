values_title: Les valeurs *auxquelles* on croit.
values_subtitle: (nos 3 préférées, parce qu’il fallait faire des choix)
values:
- title: Créativité
  body: |-
    <p>Bienvenue dans notre monde ! Chez Alunites, nous élaborons avec nos clients des solutions créatives personnalisées et adaptées aux capacités et aux enjeux de chaque projet.</p>
    <p>En explorant les tendances, mais aussi en portant un regard nouveau sur chaque problématique. On réfléchit, on invente, et on a des yeux grands ouverts qui regardent partout.<br />
    Surtout vers vous.</p>
- title: Passion
  body: <p>Sans passion, la vie paraît bien fade ! Chez Alunites, elle est au cœur de tous nos métiers, portée par des collaborateurs investis et experts dans leur domaine. Elle nous permet d’envisager tous nos projets avec force et conviction, sans brider notre imagination hors pair.</p>
- title: Agilité
  body: |-
    <p>Aujourd’hui, presque tout le monde fait du yoga. C’est comme ça. L’agilité rare qui nous distingue ne se dévoile pourtant pas sur un tapis. Elle se passe dans nos têtes et se traduit dans notre façon de piloter les projets.</p>
    <p>De la flexibilité pour mieux s’adapter à vos besoins, en mettant en place des équipes qui sauront vous suivre dans toutes vos demandes.<br />
    Même les plus tortueuses !</p>
