story_title: On n’est pas nés de la dernière pluie !
story_subtitle: (mais de la huitième pluie de l’année 2004 !)
story_lead: <p>C’est à Lyon qu’<strong>Alunites</strong> a décidé de faire rugir son expertise dès 2004.</p>
story_text: |-
  <p>Depuis, bien de l’eau a coulé sous les ponts Pasteur, Lafayette et Gallieni. Notre agence a grandi, son ambition et ses expertises aussi. On ne compte plus les conseillers et les créateurs qui s’y épanouissent aujourd’hui (c’est juste une expression, nous frisons la trentaine).</p>
  <p>Chaque année, nous concevons et produisons en interne plus de 700 films (non non, nous n’avons pas ajouté un zéro !) et plus de 40 évènements. En parallèle, nous accompagnons la stratégie et le digital de petites et de grandes entreprises, que ce soit en BtoB ou en BtoC.</p>
  <p>Mais comment faisons-nous pour en faire autant ?<br />
  Nous-même, on ne le sait pas vraiment.<br />
  Le plus important, c’est que vous sachiez qu’aujourd’hui, Alunites vous propose une offre plurielle, alliant conseil et mise en œuvre opérationnelle, qui vous permet de développer votre image, votre croissance et <em>in fine</em> votre singularité.</p>
