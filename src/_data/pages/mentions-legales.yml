  Des contenus pourront être hébergés sur Vimeo, YouTube, ou d’autres plateformes de partage de vidéos ou réseaux sociaux. Ces plateformes sont régies par leurs propres conditions d’utilisation et leurs propres politiques de confidentialité, qui sont différentes de celles du site de Alunites n’a aucun contrôle sur les contenus, politiques de confidentialité et pratiques de Vimeo, YouTube ou d’autres partages de vidéos ou réseaux sociaux, et n’assume aucune responsabilité à ce titre.</p>
  <p><strong>ACCÈS AU SITE</strong><br />
