  Dans l’hypothèse où vous souhaiteriez utiliser un des contenus du site (texte, image…), vous devez obtenir l’autorisation écrite, expresse et préalable de Alunites, en écrivant à l’adresse contact@alunites.com.</p>
  <p><strong>PROTECTION DES DONNEES</strong><br />
  En France, les données personnelles sont notamment protégées par la loi n° 78-87 du 6 janvier 1978 relative à l’informatique, aux fichiers et aux libertés et par le règlement européen sur la protection des données (RGPD) du 25 mai 2018. L’utilisateur est informé que toute information qu’il communique sur le site fait l’objet d’un traitement de l’information conforme au RGPD et à la loi « informatique et libertés ». De sorte que l’utilisateur possède un droit de modification, de rectification, de consultation et de suppression des données qu’il transmet et ce, à tout moment par le biais de l’adresse dpo@alunites.com.</p>
  <p>Alunites ne collecte que des informations personnelles non sensibles relatives à l’utilisateur uniquement pour les besoins des services proposés par le site www.alunites.com. L’utilisateur fournit ces informations en toute connaissance de cause, notamment lorsqu’il procède par lui-même à leur saisie. Il est alors précisé à l’utilisateur du site www.alunites.com l’obligation ou non de fournir ces informations.</p>
  <p>Aucune information personnelle de l’utilisateur du site www.alunites.com n’est publiée à l’insu de l’utilisateur, échangée, transférée, cédée ou vendue sur un support quelconque à des tiers. »</p>
  <p><strong>LIENS HYPERTEXTES</strong><br />
  La mise en place d’un lien hypertexte vers le site www.alunites.com ne nécessite pas d’autorisation préalable et écrite de la part d’Alunites.<br />
  Néanmoins, Alunites doit en être informé dans un délai maximum de 10 jours après la mise en place du lien. En tout état de cause, Alunites n’est en aucun cas tenue responsable du contenu ainsi que des produits ou services proposés sur les sites auxquels le site www.alunites.com se trouverait lié par des liens hypertextes ou tout autre type de lien.</p>
