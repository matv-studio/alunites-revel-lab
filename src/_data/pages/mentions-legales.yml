  <p>Le site ainsi que son contenu sont protégés par la loi française sur les droits d’auteurs et les droits voisins (articles L.122-4 et suivants du Code de la propriété intellectuelle), lesquels interdisent la reproduction totale ou partielle, sans le consentement des sociétés, de ces différents éléments constitutifs. C’est pourquoi l’utilisateur s’engage à respecter les droits d’auteurs, droits de marque et droits du producteur de base de données, chaque utilisateur reconnaissant que les bases de données constituées par les sociétés sont leur propriété exclusive.<br />
