settings:
  content:
    merge: true
content:
- name: projets_2
  label: Projets
  type: collection
  path: content/projets
  filename: '{fields.slug}.md'
  view:
    primary: title
  fields:
  - name: title
    label: Titre
    type: string
    required: true
  - name: slug
    label: Adresse de la page (slug)
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: La page sera publiée sur /project/<slug>/. Ne plus modifier après publication (référencement).
  - name: published
    label: Publié
    type: boolean
  - name: date
    label: Date
    type: date
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm:ss
  - name: client
    label: Client
    type: string
  - name: expertises
    label: Expertises
    type: reference
    list: true
    options:
      collection: expertises_2
      value: '{slug}'
      label: '{title}'
  - name: cover
    label: Image principale
    type: image
  - name: hook
    label: Accroche (une ligne par entrée)
    type: string
    list: true
  - name: intro
    label: Texte d'introduction
    type: rich-text
    options:
      format: html
  - name: keywords
    label: Mots-clés
    type: string
    list: true
  - name: blocks
    label: Blocks
    type: object
    list: true
    fields:
    - name: type
      label: Type
      type: select
      options:
        values:
        - text
        - quote
        - image
        - slider
        - video
    - name: quote
      label: Quote
      type: rich-text
      options:
        format: html
    - name: body
      label: Body
      type: rich-text
      options:
        format: html
    - name: style
      label: Style
      type: select
      options:
        values:
        - fullscreen
        - column
    - name: image
      label: Image
      type: image
    - name: images
      label: Images
      type: image
      list: true
    - name: author
      label: Author
      type: string
    - name: video
      label: Video
      type: text
    - name: cover
      label: Cover
      type: image
    - name: alt
      label: Alt
      type: string
  - name: suggestions
    label: Projets suggérés en bas de page
    type: reference
    list: true
    options:
      collection: projets_2
      value: '{slug}'
      label: '{title}'
  - name: seo
    label: Seo
    type: object
    fields:
    - name: image
      label: Image
      type: image
    - name: title
      label: Title
      type: string
    - name: description
      label: Description
      type: text
  - name: wp_id
    label: Identifiant WordPress (redirections)
    type: number
  - name: chapeau
    label: Chapeau
    type: rich-text
    options:
      format: html
  - name: home_video
    label: Vidéo (bandeau d'accueil)
    type: text
    description: Lien direct .mp4 Vimeo utilisé si le projet est mis à la une sur l'accueil.
- name: actualites_2
  label: Actualités
  type: collection
  path: content/actualites
  filename: '{fields.slug}.md'
  view:
    primary: title
  fields:
  - name: title
    label: Titre
    type: string
    required: true
  - name: slug
    label: Adresse de la page (slug)
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: La page sera publiée sur /<slug>/. Ne plus modifier après publication (référencement).
  - name: published
    label: Publié
    type: boolean
  - name: date
    label: Date de publication (tri)
    type: date
    options:
      time: true
      format: yyyy-MM-dd'T'HH:mm:ss
  - name: display_date
    label: Date affichée
    type: date
  - name: categories
    label: Rubriques
    type: reference
    list: true
    options:
      collection: rubriques
      value: '{slug}'
      label: '{title}'
  - name: cover
    label: Image principale
    type: image
  - name: hook
    label: Accroche (une ligne par entrée)
    type: string
    list: true
  - name: chapeau
    label: Chapeau
    type: rich-text
    options:
      format: html
  - name: intro
    label: Texte d'introduction
    type: rich-text
    options:
      format: html
  - name: keywords
    label: Mots-clés
    type: string
    list: true
  - name: blocks
    label: Blocks
    type: object
    list: true
    fields:
    - name: type
      label: Type
      type: select
      options:
        values:
        - text
        - quote
        - image
        - slider
        - video
    - name: style
      label: Style
      type: select
      options:
        values:
        - fullscreen
        - column
    - name: image
      label: Image
      type: image
    - name: body
      label: Body
      type: rich-text
      options:
        format: html
    - name: quote
      label: Quote
      type: rich-text
      options:
        format: html
    - name: video
      label: Video
      type: text
    - name: cover
      label: Cover
      type: image
    - name: images
      label: Images
      type: image
      list: true
  - name: suggestions
    label: Actualités suggérées en bas de page
    type: reference
    list: true
    options:
      collection: actualites_2
      value: '{slug}'
      label: '{title}'
  - name: wp_id
    label: Identifiant WordPress (redirections)
    type: number
  - name: expertises
    label: Expertises
    type: reference
    list: true
    options:
      collection: expertises_2
      value: '{slug}'
      label: '{title}'
  - name: home_video
    label: Vidéo (bandeau d'accueil)
    type: text
  - name: seo
    label: Seo
    type: object
    fields:
    - name: title
      label: Title
      type: string
    - name: image
      label: Image
      type: image
    - name: description
      label: Description
      type: text
  - name: cover_alt
    label: Description de l'image principale
    type: string
- name: expertises_2
  label: Expertises
  type: collection
  path: content/expertises
  filename: '{fields.slug}.md'
  view:
    primary: title
  fields:
  - name: title
    label: Titre
    type: string
    required: true
  - name: slug
    label: Adresse (slug)
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    description: Partie de l’adresse propre à chaque contenu ; ne plus la modifier après publication (référencement).
  - name: order
    label: Ordre d'affichage
    type: number
  - name: color
    label: Couleur
    type: select
    options: &id001
      values:
      - orange
      - orangeLight
      - purple
      - purpleLight
  - name: summary
    label: Résumé (page d'accueil)
    type: text
  - name: introduction
    label: Introduction
    type: rich-text
    options:
      format: html
  - name: sectors_title
    label: Titre de la liste des secteurs
    type: string
  - name: sectors
    label: Secteurs d'activité
    type: string
    list: true
  - name: video
    label: Lien de la vidéo
    type: text
  - name: video_cover
    label: Couverture de la vidéo
    type: image
  - name: activities_title
    label: Titre des activités
    type: string
    description: Mots entre *astérisques* mis en couleur.
  - name: activities
    label: Activités
    type: object
    list: true
    fields:
    - name: title
      label: Titre
      type: string
    - name: body
      label: Texte
      type: rich-text
      options:
        format: html
  - name: formats
    label: Formats (pictogrammes)
    type: object
    list: true
    fields:
    - name: title
      label: Titre
      type: string
    - name: icon
      label: Pictogramme (SVG)
      type: image
  - name: contact_quote
    label: Phrase d'appel au contact
    type: string
  - name: suggestions
    label: Projets mis en avant
    type: reference
    list: true
    options:
      collection: projets_2
      value: '{slug}'
      label: '{title}'
  - name: wp_id
    label: Wp id
    type: number
  - name: contact_person
    label: Interlocuteur
    type: reference
    options:
      collection: equipe
      value: '{slug}'
      label: '{title}'
- name: equipe
  label: Équipe
  type: collection
  path: content/equipe
  filename: '{fields.slug}.md'
  view:
    primary: name
  fields:
  - name: name
    label: Nom
    type: string
    required: true
  - name: slug
    label: Identifiant
    type: string
    required: true
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  - name: published
    label: Affiché sur le site
    type: boolean
    default: true
  - name: order
    label: Ordre d'affichage
    type: number
  - name: job
    label: Fonction
    type: string
  - name: quote
    label: Citation
    type: string
  - name: email
    label: E-mail (non affiché)
    type: string
  - name: photo
    label: Photo
    type: image
  - name: photo_hover
    label: Photo au survol
    type: image
  - name: wp_id
    type: number
    hidden: true
- name: rubriques
  label: Rubriques
  type: collection
  path: content/rubriques
  filename: '{fields.slug}.md'
  view:
    primary: title
  fields:
  - name: title
    label: Nom
    type: string
    required: true
  - name: slug
    label: Identifiant
    type: string
    required: true
  - name: color
    label: Couleur
    type: select
    options: *id001
  - name: order
    label: Ordre
    type: number
  - name: published
    label: Publié
    type: boolean
